name: NEO-UNO CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================================================
  # JOB 1: TỰ ĐỘNG KIỂM THỬ MÁY CHỦ BACKEND (SECURITY & LOGIC TESTS)
  # ==========================================================================
  test-backend:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: neo_uno_ci_cd_test_secret_key_2026
      PORT: 5001
      MONGODB_URI: mongodb+srv://nguyentronghung11102019_db_user:hung0123@jaytee2k4.tsab6tz.mongodb.net/neo_uno?retryWrites=true&w=majority

    steps:
      - name: 📥 Tải mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Cài đặt Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🧪 Chạy Kiểm thử Đơn vị & Cơ chế Dọn dẹp (Match Replay & Retention)
        run: |
          cd backend
          node test/match_replay_and_report.test.js
          node test/match_retention.test.js

  # ==========================================================================
  # JOB 2: TỰ ĐỘNG BIÊN DỊCH GIAO DIỆN FRONTEND (VITE PRODUCTION BUILD)
  # ==========================================================================
  build-frontend:
    name: Frontend Code-Splitting Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Cài đặt Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🚀 Biên dịch Vite Production Bundle
        run: |
          cd frontend
          npm run build

      - name: ✅ Xác thực file phân phối dist/
        run: |
          test -f frontend/dist/index.html && echo "Frontend build artifact valid!"

  # ==========================================================================
  # JOB 3: KIỂM ĐỊNH TÍNH TOÀN VẸN CONTAINER DOCKER (DOCKER BUILD CHECK)
  # ==========================================================================
  docker-validation:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: 📥 Tải mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: 🐳 Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Đóng gói Backend Docker Image
        run: |
          docker build -t neo-uno-backend:test ./backend

      - name: 🔨 Đóng gói Frontend Docker Image (Multi-stage Nginx)
        run: |
          docker build -t neo-uno-frontend:test ./frontend

      - name: 🎉 Thông báo hoàn tất CI/CD
        run: |
          echo "✅ Tất cả các bài kiểm thử và đóng gói Docker đã thành công 100%!"
