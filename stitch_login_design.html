      tabRegister.className = "flex-1 py-2.5 rounded-full font-label-lg text-label-lg tracking-wider transition-all duration-300 text-center bg-secondary-container text-on-secondary-container shadow-md";

      // Fields toggle

      confirmField.classList.remove('hidden');
      forgotLink.classList.add('invisible');
      // Submit Button adjustments
      submitBtn.className = "w-full py-3.5 px-space-md rounded-full bg-secondary-container text-on-secondary-container font-headline-md text-headline-md tracking-wider uppercase flex items-center justify-center gap-space-sm shadow-xl hover:shadow-[0_0_24px_rgba(212,0,75,0.6)] hover:scale-[1.01] active:scale-[0.98] transition-all";

    } else {
      // Style toggle
      tabLogin.className = "flex-1 py-2.5 rounded-full font-label-lg text-label-lg tracking-wider transition-all duration-300 text-center bg-primary-container text-on-primary-container shadow-md";
      tabRegister.className = "flex-1 py-2.5 rounded-full font-label-lg text-label-lg tracking-wider transition-all duration-300 text-center text-on-surface-variant hover:text-on-surface";
      // Fields toggle
      nicknameField.classList.add('hidden');
      confirmField.classList.add('hidden');
      forgotLink.classList.remove('invisible');
      // Submit Button adjustments
      submitBtn.className = "w-full py-3.5 px-space-md rounded-full bg-primary-container text-on-primary font-headline-md text-headline-md tracking-wider uppercase flex items-center justify-center gap-space-sm shadow-xl hover:shadow-[0_0_24px_rgba(0,210,255,0.6)] hover:scale-[1.01] active:scale-[0.98] transition-all";

    }
  }
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
  function triggerBotMatch() {
    const submitBtn = document.getElementById('btn-submit');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span><span>ĐANG KẾT NỐI BOT ARENA...</span>';
    setTimeout(() => {
      submitBtn.innerHTML = originalText;
      alert('Bàn đấu PvE sẵn sàng! Đang tải bộ bài UNO 108 lá và cấu hình Bot AI cấp độ Master...');
    }, 800);
  }
</script></main>
