<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#182035" />
      <stop offset="60%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>

    <!-- Neon Cyan & Magenta Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#ff8c00" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonCyan)" stroke-width="4" opacity="0.6" />

  <!-- Cyber Grid Background Accent -->
  <g opacity="0.15" stroke="#00f0ff" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- UNO Stack of Cards -->
  <!-- Card 1: Back Card (Magenta) -->
  <g transform="translate(256,236) rotate(-16) translate(-100,-140)">
    <rect width="200" height="280" rx="24" fill="#0c1020" stroke="url(#neonMagenta)" stroke-width="6" filter="url(#glowCyan)" />
    <ellipse cx="100" cy="140" rx="70" ry="100" fill="none" stroke="#ff007a" stroke-width="3" opacity="0.4" />
    <text x="100" y="152" font-family="'Sora', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ff007a" text-anchor="middle" letter-spacing="2">UNO</text>
  </g>

  <!-- Card 2: Front Card (Cyan Neon) -->
  <g transform="translate(256,256) rotate(10) translate(-100,-140)">
    <rect width="200" height="280" rx="24" fill="#0d1428" stroke="url(#neonCyan)" stroke-width="8" filter="url(#glowCyan)" />
    <ellipse cx="100" cy="140" rx="72" ry="106" fill="url(#neonCyan)" opacity="0.12" />
    <ellipse cx="100" cy="140" rx="66" ry="98" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="12 6" />
    
    <!-- Central UNO Emblem -->
    <text x="100" y="158" font-family="'Sora', 'Arial Black', sans-serif" font-weight="900" font-size="56" fill="#ffffff" text-anchor="middle" filter="url(#glowCyan)">UNO</text>
    <text x="32" y="54" font-family="'Sora', sans-serif" font-weight="900" font-size="28" fill="#00f0ff">7</text>
    <text x="168" y="246" font-family="'Sora', sans-serif" font-weight="900" font-size="28" fill="#00f0ff" text-anchor="end">7</text>
  </g>

  <!-- App Title Banner: NEO-UNO -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-30" width="280" height="56" rx="28" fill="#0c101d" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glowGold)" />
    <text x="0" y="8" font-family="'Sora', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">NEO • UNO</text>
  </g>
</svg>
